{% extends "base.html" %}
{% block title %}Team Competency Heatmap{% endblock %}
{% block content %}
<h2>Team Competency Heatmap</h2>
<p class="text-muted">All members' pillar averages compared side-by-side</p>

<div class="card mb-4">
    <div class="card-body">
        <canvas id="heatmapChart" height="{{ max(300, evaluations|length * 40) }}"></canvas>
    </div>
</div>

{% if evaluations %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const ctx = document.getElementById('heatmapChart').getContext('2d');
    const names = [{% for ev in evaluations %}'{{ ev.candidate_name }}',{% endfor %}];
    const data = {
        labels: names,
        datasets: [
            {
                label: 'Technical',
                data: [{% for ev in evaluations %}{{ ev.technical_avg or 0 }},{% endfor %}],
                backgroundColor: 'rgba(54, 162, 235, 0.7)',
            },
            {
                label: 'Problem Solving',
                data: [{% for ev in evaluations %}{{ ev.problem_solving_avg or 0 }},{% endfor %}],
                backgroundColor: 'rgba(75, 192, 192, 0.7)',
            },
            {
                label: 'Interpersonal',
                data: [{% for ev in evaluations %}{{ ev.interpersonal_avg or 0 }},{% endfor %}],
                backgroundColor: 'rgba(255, 206, 86, 0.7)',
            },
            {
                label: 'Organizational',
                data: [{% for ev in evaluations %}{{ ev.organizational_avg or 0 }},{% endfor %}],
                backgroundColor: 'rgba(255, 99, 132, 0.7)',
            },
        ]
    };
    new Chart(ctx, {
        type: 'bar',
        data: data,
        options: {
            indexAxis: 'y',
            scales: { x: { min: 0, max: 5 } },
            plugins: {
                title: { display: true, text: 'Team Competency Heatmap' }
            },
            responsive: true,
        }
    });
});
</script>
{% else %}
<div class="alert alert-info">No evaluations to display. <a href="/questionnaire">Start your first evaluation</a>.</div>
{% endif %}
{% endblock %}
